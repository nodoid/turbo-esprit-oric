# Turbo Esprit for the Oric Atmos - memory layout.
#
# $5B00-$7BBD holds the Spectrum game's working RAM at the SAME addresses as
# on the Spectrum (bit-reverse table, lane grid, 3D buffer, game variables
# and tables), loaded from data/zxram.bin.  Code lives below and above it.
MEMORY {
    ZP:     file = "", start = $0000, size = $0100;
    LORAM:  file = "", start = $0200, size = $0044;    # $0244-$0249: IRQ/NMI jumps
    PG4:    file = "", start = $0400, size = $0100;
    LOW:    file = %O, start = $0600, size = $5500, fill = yes, fillval = 0;
    ZXRAM:  file = %O, start = $5B00, size = $20BE, fill = yes;
    HIGH:   file = %O, start = $7BBE, size = $1C42;
    HIBSS:  file = "", start = $9C00, size = $0400;    # alternate charset area, unused
}
SEGMENTS {
    ZEROPAGE: load = ZP,    type = zp;
    TABLES:   load = LOW,   type = ro,  optional = yes;   # first: page aligned at $0600
    STARTUP:  load = LOW,   type = ro,  optional = yes;
    CODE:     load = LOW,   type = ro;
    RODATA:   load = LOW,   type = ro;
    DATA:     load = LOW,   type = rw;
    ZXRAM:    load = ZXRAM, type = rw, start = $5B00;
    CODE2:    load = HIGH,  type = ro;
    RODATA2:  load = HIGH,  type = ro,  optional = yes;
    DATA2:    load = HIGH,  type = rw,  optional = yes;
    BSS:      load = PG4,   type = bss, define = yes;
    LOBSS:    load = LORAM, type = bss, optional = yes;
    HIBSS:    load = HIBSS, type = bss, optional = yes;
}
