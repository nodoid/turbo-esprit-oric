# Turbo Esprit for the Oric Atmos (64K: needs the Microdisc-style overlay
# RAM at $C000) - memory layout.
#
# $5B00-$7BBD holds the Spectrum game's working RAM at the SAME addresses as
# on the Spectrum (bit-reverse table, lane grid, 3D buffer, game variables
# and tables), loaded from data/zxram.bin.  Code lives below and above it.
MEMORY {
    ZP:     file = "", start = $0000, size = $0100;
    LORAM:  file = "", start = $0180, size = $0180;    # stack is $0100-$017F; ROM vectors in page 2 unused
    PG4:    file = "", start = $0400, size = $0100;
    LOW:    file = %O, start = $0600, size = $5500, fill = yes, fillval = 0;
    ZXRAM:  file = %O, start = $5B00, size = $1800, fill = yes;  # $5B00-$72FF
    HOLE1:  file = %O, start = $7300, size = $00DA, fill = yes, define = yes;  # Spectrum main-loop code bytes:
    ZXRAM2: file = %O, start = $73DA, size = $002A, fill = yes;  #   free for data
    HOLE2:  file = %O, start = $7404, size = $00CF, fill = yes, define = yes;
    ZXRAM3: file = %O, start = $74D3, size = $06EB, fill = yes;  # $74D3-$7BBD
    HIGH:   file = %O, start = $7BBE, size = $1C42, fill = yes;
    CHARS:  file = %O, start = $9800, size = $0400, fill = yes;  # HIRES character set (text lines)
    HIDATA: file = %O, start = $9C00, size = $01CE;    # alternate charset area: data ...
    HIBSS:  file = "", start = $9DCE, size = $0232, define = yes;  # ... and variables
    OVL:    file = "%O.ovl", start = $C000, size = $3FFA;  # RAM under the ROM (to $FFF9)
    # blobs loaded from disk when needed (src/disk.inc), into game work RAM
    MENU:   file = "%O.menu", start = $5C00, size = $0C6B, define = yes;  # lane grid..city maps, free between games
    DASHA:  file = "%O.dash", start = $6900, size = $0740;  # 3D buffer, at game start
}
SEGMENTS {
    ZEROPAGE: load = ZP,    type = zp;
    STARTUP:  load = LOW,   type = ro,  optional = yes;   # first: the entry point is $0600
    TABLES:   load = LOW,   type = ro,  optional = yes, align = $100;
    CODE:     load = LOW,   type = ro;
    RODATA:   load = LOW,   type = ro;
    DATA:     load = LOW,   type = rw;
    ZXRAM:    load = ZXRAM,  type = rw, start = $5B00;
    RODATAH1: load = HOLE1,  type = ro, optional = yes;
    ZXRAM2:   load = ZXRAM2, type = rw;
    RODATAH2: load = HOLE2,  type = ro, optional = yes;
    ZXRAM3:   load = ZXRAM3, type = rw;
    CODE2:    load = HIGH,  type = ro;
    RODATA2:  load = HIGH,  type = ro,  optional = yes;
    DATA2:    load = HIGH,  type = rw,  optional = yes;
    CHARSET:  load = CHARS, type = rw,  optional = yes;   # loaded at $9800
    BSS:      load = PG4,   type = bss, define = yes;
    LOBSS:    load = LORAM, type = bss, optional = yes;
    LOWRAM:   load = LORAM, type = bss, optional = yes;
    RODATA4:  load = HIDATA, type = ro, optional = yes;
    HIBSS:    load = HIBSS, type = bss, optional = yes;
    MCODE:    load = MENU,  type = ro,  optional = yes;
    MRODATA:  load = MENU,  type = ro,  optional = yes;
    DASHBLOB: load = DASHA, type = ro,  optional = yes;
    CODE3:    load = OVL,   type = ro,  optional = yes;
    RODATA3:  load = OVL,   type = ro,  optional = yes;
    DATA3:    load = OVL,   type = rw,  optional = yes;
}
